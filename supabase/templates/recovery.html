<!--
  Template "Reset password" do Supabase.
  Dashboard → Authentication → Emails → Reset password → cole este HTML.
  Assunto sugerido: Redefina sua senha do CrazyPanel
-->
<div style="font-family: Arial, Helvetica, sans-serif; background:#0b0f15; padding:32px 0;">
  <div style="max-width:460px; margin:0 auto; background:#111720; border:1px solid #1f2835; border-radius:12px; padding:32px; color:#e6ebf2;">
    <h2 style="margin:0 0 8px; font-size:18px;">CrazyPanel</h2>
    <p style="margin:0 0 24px; color:#8592a5; line-height:1.5;">
      Recebemos um pedido para criar uma nova senha para a sua conta.
    </p>
    <a
      href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
      style="display:inline-block; background:#3b6fb3; color:#ffffff; text-decoration:none; font-weight:bold; padding:12px 20px; border-radius:8px;"
    >Criar nova senha</a>
    <p style="margin:24px 0 0; font-size:12px; color:#6b778a;">
      Se você não pediu, ignore este e-mail: sua senha continua a mesma.
    </p>
  </div>
</div>
